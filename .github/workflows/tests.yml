name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Speeds up repeat runs: sentence-transformers downloads the
      # embedding model (all-MiniLM-L6-v2) from HuggingFace on first
      # use otherwise, on every run.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          HF_HUB_OFFLINE: "0"
        run: >
          python -m pytest -q
          --ignore=tests/test_ollama_client.py
          --ignore=tests/test_rag_pipeline.py
