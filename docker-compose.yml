services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "1"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      # host.docker.internal reaches the host machine from inside the
      # container (Docker Desktop on Windows/Mac) -- override in .env
      # if Ollama runs somewhere else (e.g. a real Linux host, where
      # this name isn't available by default).
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      WAZUH_API_URL: "${WAZUH_API_URL:-}"
      WAZUH_API_USERNAME: "${WAZUH_API_USERNAME:-}"
      WAZUH_API_PASSWORD: "${WAZUH_API_PASSWORD:-}"
      WAZUH_API_VERIFY_SSL: "${WAZUH_API_VERIFY_SSL:-false}"
      WAZUH_INDEXER_URL: "${WAZUH_INDEXER_URL:-}"
      WAZUH_INDEXER_USERNAME: "${WAZUH_INDEXER_USERNAME:-}"
      WAZUH_INDEXER_PASSWORD: "${WAZUH_INDEXER_PASSWORD:-}"
      WAZUH_INDEXER_VERIFY_SSL: "${WAZUH_INDEXER_VERIFY_SSL:-false}"
    depends_on:
      - qdrant
    volumes:
      - ./logs:/app/logs

volumes:
  qdrant_data:
